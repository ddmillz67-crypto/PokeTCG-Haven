kanaal: sniper-nlbe
berichten:
  - sleutel: kaart
    embeds:
      - soort: alert
        titel: "⚡ Welkom bij Haven Sniper"
        beschrijving: "Hier verschijnt elke restock bij Nederlandse en Belgische winkels direct, en de winkel-radar zonder vertraging. Bedankt dat je de community steunt!"
        velden:
          - naam: "🔔 Persoonlijke meldingen"
            waarde: "Gebruik `/pings` om te kiezen voor welke producten je een DM wilt (bijvoorbeeld alleen ETB's of booster boxes). Zet DM's van serverleden aan, anders komt de melding niet aan."
          - naam: "🏆 Gescoord?"
            waarde: "Klik op **Gescoord!** onder een alert. Je succes verschijnt in {#success}."
          - naam: "Eerlijk spel"
            waarde: "We sturen alerts, geen koopbots: je koopt zelf met de hand. Zo loop je geen risico dat een winkel je bestelling annuleert."
          - naam: "Vragen over je abonnement?"
            waarde: "Open een ticket in {#tickets}."
