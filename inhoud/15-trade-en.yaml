kanaal: trade-en
berichten:
  - sleutel: kaart
    post_titel: "📌 Read this first: trade safely"
    embeds:
      - soort: regels
        titel: "📌 Trading safely in the market"
        beschrijving: "Each post is one listing with a tag: **For sale**, **Wanted** or **Trade**. Posting is possible from level 5; everyone can reply."
        velden:
          - naam: "📸 Photos required"
            waarde: "Front and back, with your Discord name and today's date on paper next to it. Listings without photos are closed."
          - naam: "💶 Price or trade wish"
            waarde: "No \"make an offer\" without a guide price. State the condition honestly and show any damage."
          - naam: "🤝 Finishing a deal"
            waarde: "Both sides leave a `/vouch`. With 5 vouches you can become a Verified Trader. Above roughly €50, ship tracked or insured and post the tracking in the thread."
          - naam: "⚠️ Watch out"
            waarde: "Never pay a stranger without buyer protection. The team mediates but is not a party to the deal and does not cover losses. Trading for money from 16, or younger with a parent's permission."
          - naam: "Need help?"
            waarde: "Open a ticket in {#tickets}."
