kanaal: regels
berichten:
  - sleutel: waarom
    embeds:
      - banner: regels
        soort: regels
      - soort: regels
        titel: "Waarom we huisregels hebben"
        beschrijving: |
          We willen dat **iedereen zich hier thuis voelt**: van de beginner die net zijn eerste booster opent tot de verzamelaar met twintig jaar ervaring.

          Daarom hebben we **8 korte afspraken**. Bij elke afspraak leggen we uit **waarom** hij er is.

          > Door de server te gebruiken, ga je akkoord met deze afspraken.

  - sleutel: de-regels
    embeds:
      - soort: regels
        titel: "📜  De 8 huisregels"
        velden:
          - naam: "1  ·  Wees aardig"
            waarde: "Geen haat, pesten of discriminatie, en niemand lacht om andermans collectie.\n> *Waarom: iedereen begint ergens.*\n​"
          - naam: "2  ·  Gebruik het juiste kanaal"
            waarde: "Elk kanaal heeft een vastgepinde kanaalkaart die uitlegt waar het voor is.\n> *Waarom: zo blijft alles overzichtelijk.*\n​"
          - naam: "3  ·  Handel alleen in de markt"
            waarde: "Kopen, verkopen en ruilen doe je in {#ruilen-verkopen}, vanaf **level 5**. Stuur niemand ongevraagd een DM met een aanbod.\n> *Waarom: in de markt zie je vouches. Oplichters werken via DM's.*\n​"
          - naam: "4  ·  Geen namaak, geen oplichting"
            waarde: "Namaakkaarten verkopen of ruilen is verboden. Oplichting betekent een **directe ban**.\n> *Waarom: vertrouwen is de basis van verzamelen.*\n​"
          - naam: "5  ·  Geen spam of reclame"
            waarde: "Geen links naar andere servers, shops of je eigen kanaal zonder toestemming van het team.\n> *Waarom: niemand komt hier voor reclame.*\n​"
          - naam: "6  ·  Geen gokken"
            waarde: "Geen betaalde loterijen, raffles, mystery packs of breaks met een willekeurige uitkomst.\n> *Waarom: dat is in Nederland en België vaak een verboden kansspel.*\n​"
          - naam: "7  ·  Bescherm je privacy"
            waarde: "Deel geen adressen, telefoonnummers of screenshots van privéberichten.\n> *Waarom: je weet nooit wie er meeleest.*\n​"
          - naam: "8  ·  Volg de regels van Discord"
            waarde: "Je bent minimaal **13 jaar**. Handelen met geld kan vanaf **16 jaar**, of jonger met toestemming van een ouder. Kaart tegen kaart ruilen mag iedereen.\n> *Waarom: zo beschermen we jongere leden.*"
        footer: "PokeTCG Haven is niet verbonden aan The Pokémon Company, Nintendo of Game Freak."

  - sleutel: veilig-handelen
    embeds:
      - soort: regels
        titel: "🛡️  Veilig handelen in 4 stappen"
        beschrijving: |
          **1.**  Check de **vouches** en of iemand **Verified Trader** is.

          **2.**  Vraag een foto van de kaart, met de **naam van de verkoper** en de **datum** op een papiertje ernaast.

          **3.**  Betaal een onbekende **nooit** zonder kopersbescherming.

          **4.**  Deal rond? Geef elkaar een vouch met `/vouch`.

  - sleutel: als-er-iets-misgaat
    embeds:
      - soort: regels
        titel: "🆘  Als er iets misgaat"
        beschrijving: |
          Zie je iets wat niet klopt, of heb je een vraag? **Open een ticket.** Een moderator helpt je zo snel mogelijk.

          **Bij een overtreding nemen we deze stappen:**
          ▸  een waarschuwing
          ▸  een time-out van 24 uur
          ▸  een time-out van 7 dagen, zonder toegang tot de markt
          ▸  een ban

          Oplichting, namaak en haat leiden **direct** tot een ban. Bezwaar maken kan altijd via een ticket.
    knoppen:
      - { label: "Duidelijk, start de tour", emoji: "🧭", actie: "tour:start", stijl: groen }
      - { label: "Ik heb een vraag", emoji: "❓", actie: "regels:vraag" }
