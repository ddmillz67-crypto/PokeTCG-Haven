kanaal: giveaways
berichten:
  - sleutel: zo-werkt-het
    embeds:
      - banner: giveaways
        soort: community
      - soort: community
        titel: "🎁  Zo werken onze giveaways"
        beschrijving: |
          Bij elke **mijlpaal** in het ledental geven we iets weg, oplopend tot **booster boxes**.

          Daarnaast is er elke maand een kleine **community-giveaway** voor actieve leden.
        velden:
          - naam: "✅  Altijd gratis"
            waarde: "Meedoen kost **nooit** iets: geen aankoop, geen abonnement, geen server-boost.\n​"
          - naam: "🧠  Een wedstrijd, geen loterij"
            waarde: "Je beantwoordt een **vraag over de Pokémon TCG** en doet een **schatting**.\nVan iedereen met het goede antwoord wint de **beste schatting**.\n​"
          - naam: "👤  Wie mag meedoen?"
            waarde: "Leden die minstens **7 dagen** lid zijn, **level 3** of hoger, met een verzendadres in **Nederland of België**.\nJonger dan 18? Dan vragen we bij het opsturen toestemming van een ouder.\n​"
          - naam: "📦  Gewonnen?"
            waarde: "Je krijgt een melding en meldt je binnen **72 uur** via een ticket.\nWe versturen **verzekerd** en verwijderen je adres daarna."
    knoppen:
      - { label: "Zet meldingen voor giveaways aan", emoji: "🔔", kanaal: rollen }

  - sleutel: spelvoorwaarden
    embeds:
      - soort: community
        titel: "📄  Spelvoorwaarden"
        beschrijving: |
          **1.**  Organisator: PokeTCG Haven. Contact via {#tickets}.
          **2.**  Meedoen is gratis. Een aankoop, abonnement, server-boost of betaalde rol is **nooit** nodig.
          **3.**  Vorm: een wedstrijd met een kennisvraag over de Pokémon TCG en een schiftingsvraag. Van alle deelnemers met het juiste antwoord wint wie het dichtst bij het antwoord op de schiftingsvraag zit. Bij een gelijke stand wint de vroegste inzending.
          **4.**  Meedoen kan als je minstens 7 dagen lid bent, minimaal level 3 hebt en een verzendadres in Nederland of België hebt. Team, moderators en organiserende Haven Helpers doen niet mee.
          **5.**  Minderjarigen doen mee met toestemming van een ouder of voogd; die vragen we bij het versturen van de prijs.
          **6.**  Eén inzending per persoon. Meerdere accounts gebruiken betekent uitsluiting van deze en volgende giveaways.
          **7.**  De prijs staat in de giveaway en kan niet worden ingeruild voor geld.
          **8.**  De winnaar staat binnen 24 uur na sluiting in dit kanaal en krijgt een melding.
          **9.**  De winnaar meldt zich binnen 72 uur via een ticket, anders gaat de prijs naar de volgende beste inzending.
          **10.**  Verzending binnen 14 dagen, verzekerd en op onze kosten. Je adres gebruiken we alleen daarvoor en verwijderen we daarna.
          **11.**  Sponsort een partnerwinkel een prijs, dan staat dat in de giveaway. De sponsor krijgt geen gegevens van deelnemers.
          **12.**  Bij misbruik of fraude kan het team een inzending ongeldig verklaren.
          **13.**  Vragen of klachten gaan via {#tickets}.
