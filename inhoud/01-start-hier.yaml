kanaal: start-hier
berichten:
  - sleutel: welkom
    embeds:
      - banner: welkom
        soort: community
      - soort: community
        titel: "Welkom, trainer! 🧡"
        beschrijving: |
          **Fijn dat je er bent!** Je bent beland in **PokeTCG Haven**.

          Dé plek voor Pokémon TCG-trainers en -verzamelaars uit **Nederland en België**.

          Hier deel je je mooiste **pulls**, ruil je **veilig** met andere verzamelaars en mis je **nooit meer een release**.

          > Of je nu net je eerste booster opent of al twintig jaar verzamelt: **elke trainer hoort erbij.**

  - sleutel: wat-vind-je-hier
    embeds:
      - soort: merk
        titel: "Wat vind je hier?"
        velden:
          - naam: "📸  Pulls en collecties"
            waarde: "Laat je mooiste kaarten zien aan mensen die het snappen.\nElke vrijdag kiezen we de **Pull van de Week**.\n​"
          - naam: "🔁  Veilig ruilen"
            waarde: "Kopen, verkopen en ruilen met **vouches**,\nzodat je altijd weet met wie je handelt.\n​"
          - naam: "📅  Releases en restocks"
            waarde: "Een **releasekalender** voor Nederland en België,\nen **alerts** zodra er weer voorraad is.\n​"
          - naam: "🎁  Giveaways"
            waarde: "Bij elke mijlpaal geven we iets weg, oplopend tot **booster boxes**.\nMeedoen is **altijd gratis**.\n​"
          - naam: "🎓  Hulp voor beginners"
            waarde: "Echt of nep? Wat is het waard? Waar begin je?\nOnze **Haven Helpers** helpen je graag."

  - sleutel: kom-binnen
    embeds:
      - soort: community
        titel: "Jouw eerste stappen, trainer"
        beschrijving: |
          **Stap 1  ·  Klik op Kom binnen**
          Je krijgt direct toegang tot de hele community.

          **Stap 2  ·  Lees de huisregels**
          Kort en duidelijk, met uitleg waarom. Je vindt ze in {#regels}.

          **Stap 3  ·  Volg de tour**
          In een paar klikken weet je precies hoe alles werkt.
    knoppen:
      - { label: "Kom binnen", emoji: "🚪", actie: "binnen", stijl: groen }
      - { label: "Lees de huisregels", emoji: "📜", kanaal: regels }
      - { label: "Start de tour", emoji: "🧭", actie: "tour:start" }
