kanaal: server-tour
berichten:
  - sleutel: route
    embeds:
      - banner: tour
        soort: merk
      - soort: merk
        titel: "🧭  Jouw route door PokeTCG Haven"
        beschrijving: |
          Niemand hoeft zelf uit te zoeken hoe het hier werkt.

          Klik op **Start mijn tour**. Je wordt dan in een paar schermen langs de belangrijkste plekken geleid. **Alleen jij ziet de tour.**

          **De route in het kort**

          **1.**  Kom binnen in {#start-hier}
          **2.**  Lees de huisregels in {#regels}
          **3.**  Kies je rollen in {#rollen}
          **4.**  Stel je voor in {#voorstellen}
          **5.**  Deel je eerste pull in {#pulls}
          **6.**  Laat je collectie zien in {#collecties}
          **7.**  Volg de releases in {#release-kalender}
          **8.**  Doe mee in {#giveaways} en op de pack-avond

          > Je kunt de tour altijd opnieuw starten met `/tour`.
    knoppen:
      - { label: "Start mijn tour", emoji: "🧭", actie: "tour:start", stijl: groen }
      - { label: "Ik ben de weg kwijt", emoji: "🗺️", actie: "tour:kwijt" }

  - sleutel: kaart
    embeds:
      - soort: merk
        titel: "🗺️  Kaart van de server"
        velden:
          - { naam: "📌  Start", waarde: "Welkom, huisregels, deze tour, aankondigingen en je rollen.\n​" }
          - { naam: "🧡  Community", waarde: "Voorstellen, pulls, collecties en giveaways.\n​" }
          - { naam: "💬  Chat & handel", waarde: "De chat, de markt, vragen en de winkel-radar.\n​" }
          - { naam: "📅  Releases", waarde: "De releasekalender, restock-alerts en de successen van leden.\n​" }
          - { naam: "🛒  Store", waarde: "Extra's voor wie sneller wil. De community blijft **altijd gratis**.\n​" }
          - { naam: "🛟  Support & partners", waarde: "Tickets en nieuws van onze partnerwinkels." }
