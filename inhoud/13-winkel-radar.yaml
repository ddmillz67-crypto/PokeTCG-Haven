kanaal: winkel-radar
berichten:
  - sleutel: kaart
    embeds:
      - banner: radar
        soort: alert
      - soort: alert
        titel: "📌  Over #winkel-radar"
        beschrijving: |
          **Samen zien we meer dan elke bot.**

          Zie je Pokémon-kaarten in een winkel liggen? Meld het met `/meld`, dan weten verzamelaars in jouw regio het ook.
        velden:
          - naam: "📍  Zo meld je"
            waarde: "`/meld` met de **winkel**, de **plaats**, het **product** en je **regio**, en voeg een **foto** toe.\nJe melding verschijnt hier met een ping voor jouw regio.\n​"
          - naam: "👎  Betrouwbaar blijven"
            waarde: "Klopt een melding niet? Reageer met 👎. Bij **2 duimen omlaag** verdwijnt hij.\nElke **1e van de maand** zetten we de **3 beste melders** hier in de **Hall of Fame** 🏆\n​"
          - naam: "⏱️  Gratis en Sniper"
            waarde: "Meldingen verschijnen hier na **10 minuten**. Leden met **Haven Sniper** zien ze direct in {#sniper-nlbe}.\n​"
          - naam: "🔔  Meldingen voor jouw regio"
            waarde: "Kies je regio in {#rollen}."
        afbeelding: "{afbeelding:radar-flow}"
