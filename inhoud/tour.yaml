# De persoonlijke tour (alleen zichtbaar voor het lid). Elke pagina heeft een knop naar het kanaal.
paginas:
  - titel: "🎛️ Kies je rollen"
    tekst: "Vertel wat je verzamelt, waar je woont en welke meldingen je wilt. Dan krijg je alleen wat jij interessant vindt.\n🇬🇧 Pick what you collect, where you live and which pings you want."
    kanaal: rollen
  - titel: "👋 Stel je voor"
    tekst: "Vertel wie je bent en wat je verzamelt. Binnen 24 uur zegt een Haven Helper hallo.\n🇬🇧 Introduce yourself; a Haven Helper will say hi within 24 hours."
    kanaal: voorstellen
  - titel: "📸 Deel je pulls"
    tekst: "Elke pull telt! Geef de mooiste een ⭐; elke vrijdag kiezen we de Pull van de Week.\n🇬🇧 Every pull counts. Star your favourites; every Friday we pick the Pull of the Week."
    kanaal: pulls
  - titel: "📒 Laat je collectie zien"
    tekst: "Maak één post voor je binder, sealed of graded kaarten. Elke maandag is het Binder Monday.\n🇬🇧 Make one post for your collection. Every Monday is Binder Monday."
    kanaal: collecties
  - titel: "📅 Releases en restocks"
    tekst: "De releasekalender, gratis restock-alerts en de winkel-radar, waar leden voorraad in winkels melden.\n🇬🇧 The release calendar, free restock alerts and the store radar."
    kanaal: release-kalender
  - titel: "🔁 Veilig ruilen"
    tekst: "Kopen, verkopen en ruilen doe je in de markt, vanaf level 5. Check altijd de vouches.\n🇬🇧 Trade in the market from level 5. Always check vouches."
    kanaal: ruilen-verkopen
    kanaal_en: trade-en
  - titel: "🎁 Giveaways en events"
    tekst: "Bij elke mijlpaal geven we iets weg, en elke zondag om 20:00 openen we samen packs. Meedoen is altijd gratis.\n\n*Wil je ooit sneller zijn bij restocks? Kijk dan in de Store. Geen verplichting: de community blijft gratis.*\n🇬🇧 Giveaways at every milestone and a pack night every Sunday at 20:00."
    kanaal: giveaways

afsluiting:
  titel: "🎉 Je bent helemaal wegwijs!"
  tekst: "Je hebt de rol **Wegwijs** gekregen. Kom je voorstellen in de community, we zijn benieuwd naar je!\n\nKen je iemand die ook verzamelt? Met `/invite` krijg je je eigen uitnodigingslink.\n🇬🇧 You're all set! Come introduce yourself. Know another collector? Use `/invite` for your own link."

kwijt:
  titel: "🗺️ Waar vind ik wat? / Where is what?"
  regels:
    - "**Kletsen:** {#chat-nlbe} of {#chat-en}"
    - "**Een vraag:** {#vragen-hulp} of {#help-en}"
    - "**Kopen, verkopen, ruilen:** {#ruilen-verkopen} of {#trade-en}"
    - "**Pulls en collecties:** {#pulls} en {#collecties}"
    - "**Releases en restocks:** {#release-kalender} en {#restocks}"
    - "**Giveaways:** {#giveaways}"
    - "**Persoonlijke hulp:** {#tickets}"
