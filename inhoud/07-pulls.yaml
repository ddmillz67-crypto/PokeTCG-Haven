kanaal: pulls
berichten:
  - sleutel: kaart
    embeds:
      - banner: pulls
        soort: community
      - soort: community
        titel: "📌  Over #pulls"
        beschrijving: |
          **Laat je pulls zien!** Groot of klein, elke pull telt.

          Onder elke pull opent automatisch een **thread**, zodat je er samen over kunt praten.
        velden:
          - naam: "📸  Wat mag hier?"
            waarde: "Alleen **foto's en video's** van je pulls, eventueel met een korte tekst.\nBerichten zonder foto worden automatisch verwijderd; praten doe je in de thread.\n​"
          - naam: "⭐  Pull van de Week"
            waarde: "Geef je favoriete pulls een ⭐. Elke **vrijdag** wint de pull met de meeste sterren:\n**7 dagen een eigen rol** en een shout-out in {#aankondigingen}.\n​"
          - naam: "💡  Zo ziet een goede pull eruit"
            waarde: "Een scherpe foto van de kaart, met de set erbij:\n> *\"Eindelijk! Charizard ex SIR uit Obsidian Flames 🔥\"*\n​"
          - naam: "❓  Wat is je kaart waard?"
            waarde: "Vraag het in {#vragen-hulp}."
