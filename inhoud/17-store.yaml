kanaal: store
berichten:
  - sleutel: welkom
    embeds:
      - banner: store
        soort: premium
      - soort: premium
        titel: "🛒  Welkom in de PokeTCG Haven Store"
        beschrijving: |
          **De community blijft altijd gratis.**

          Hier vind je **extra's** voor wie sneller of verder wil. Kijk rustig rond: niemand stuurt je een aanbieding.

  - sleutel: vergelijking
    embeds:
      - soort: premium
        titel: "Gratis, Sniper of Elite?"
        velden:
          - naam: "🧡  Gratis"
            waarde: "Alle community-kanalen\nRuilen en hulp\nGiveaways en events\nRestock-alerts na 10 min\nWinkel-radar na 10 min\n\n**€0**"
            inline: true
          - naam: "⚡  Haven Sniper"
            waarde: "Alles van Gratis\nAlerts **direct**\nPersoonlijke meldingen\nWinkel-radar **direct**\n​\n\n**€6,99 / maand**"
            inline: true
          - naam: "💎  Haven Elite"
            waarde: "Alles van Sniper\nAlerts Duitsland & Frankrijk\nPrijsalerts singles\nSealed-rapport\nVoorrang group buys\n\n**€12,99 / maand**\n*binnenkort*"
            inline: true

  - sleutel: sniper
    embeds:
      - soort: alert
        titel: "⚡  Haven Sniper  ·  €6,99 per maand"
        beschrijving: |
          **Mis nooit meer een drop.**

          Elke restock bij Nederlandse en Belgische winkels **direct** in {#sniper-nlbe}, met de **prijs**, de **limiet** en een **directe link**.

          Met `/pings` kies je voor welke producten je een **persoonlijke melding** krijgt.

          > Maandelijks opzegbaar.
        thumbnail: "{afbeelding:logo}"
    knoppen:
      - { label: "Koop via Whop", emoji: "🛒", url: "{env:WHOP_SNIPER_URL}" }
      - { label: "Meer info", emoji: "ℹ️", actie: "store:info:sniper" }
      - { label: "Vraag stellen", emoji: "❓", actie: "ticket:store" }

  - sleutel: founder
    embeds:
      - soort: release
        titel: "🌟  Founder-pas  ·  €79 voor het eerste jaar"
        beschrijving: |
          **Voor onze eerste 100 fans.**

          Een jaar **Haven Sniper**, plus **Haven Elite** zodra die live is, een vaste **Founder-badge** en **blijvende korting**.

          > Op = op.
    knoppen:
      - { label: "Koop via Whop", emoji: "🛒", url: "{env:WHOP_FOUNDER_URL}" }
      - { label: "Meer info", emoji: "ℹ️", actie: "store:info:founder" }

  - sleutel: elite
    embeds:
      - soort: premium
        titel: "💎  Haven Elite  ·  €12,99 per maand  (binnenkort)"
        beschrijving: |
          Alles van Sniper, plus alerts voor **Duitse en Franse winkels**, **prijsalerts voor singles**, een maandelijks **sealed-rapport**, **voorrang bij group buys** en de **Elite-lounge**.

          We openen Elite zodra **alle functies echt werken**.
    knoppen:
      - { label: "Koop via Whop", emoji: "🛒", url: "{env:WHOP_ELITE_URL}" }
      - { label: "Meer info", emoji: "ℹ️", actie: "store:info:elite" }

  - sleutel: partner
    embeds:
      - soort: merk
        titel: "🏪  Haven Partner  ·  voor kaartwinkels"
        beschrijving: |
          **Heb je een kaartwinkel?**

          Krijg een **eigen plek** in {#winkel-partners} voor je restocks en events, een **vermelding in de winkel-radar** en de mogelijkheid om **giveaways te sponsoren**.

          > De eerste 3 maanden gratis, daarna €29 per maand.
    knoppen:
      - { label: "Meer info", emoji: "ℹ️", actie: "store:info:partner" }
      - { label: "Neem contact op", emoji: "✉️", actie: "ticket:partner" }

  - sleutel: faq
    embeds:
      - soort: premium
        titel: "❓  Veelgestelde vragen"
        beschrijving: "Opzeggen, betalen, je rol die niet verschijnt of het herroepingsrecht: klik op de knop voor **alle antwoorden**."
    knoppen:
      - { label: "Lees de FAQ", emoji: "📖", actie: "store:faq" }
      - { label: "Vraag stellen", emoji: "❓", actie: "ticket:store" }
