kanaal: chat-nlbe
berichten:
  - sleutel: kaart
    embeds:
      - soort: community
        titel: "📌 Over #chat-nlbe"
        beschrijving: "De huiskamer van PokeTCG Haven. Kletsen over kaarten, sets, je laatste aankoop of gewoon je dag."
        velden:
          - naam: "Wat mag hier?"
            waarde: "Alles wat gezellig is en met Pokémon of verzamelen te maken heeft. Kopen en verkopen doe je in {#ruilen-verkopen}, vragen stel je het best in {#vragen-hulp}."
          - naam: "💬 Vraag van de week"
            waarde: "Elke woensdag stellen we hier een vraag aan iedereen, zoals: *\"Welke kaart zoek je al jaren?\"*"
          - naam: "Levels"
            waarde: "Door mee te praten verdien je XP. Vanaf level 5 mag je in de markt posten, vanaf level 3 doe je mee aan giveaways. Bekijk je level met `/level`."
          - naam: "Hulp nodig?"
            waarde: "Volg de tour in {#server-tour} of open een ticket in {#tickets}."
