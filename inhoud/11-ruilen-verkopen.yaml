            waarde: "Geen *\"bied maar\"* zonder richtprijs.\nVermeld de conditie eerlijk (**Near Mint**, **Lightly Played** …) en laat beschadigingen zien.\n​"
          - naam: "🤝  Deal afronden"
            waarde: "Geef elkaar een `/vouch`. Met **5 vouches** kun je **Verified Trader** worden.\nBoven circa **€50** verzend je aangetekend of verzekerd, met de track-and-trace in de thread.\n​"
