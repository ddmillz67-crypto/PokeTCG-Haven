            waarde: "Betaal een onbekende **nooit** zonder kopersbescherming.\nHet team bemiddelt bij problemen, maar is geen partij bij de deal en vergoedt geen schade.\nHandelen met geld vanaf **16 jaar**, of jonger met toestemming van een ouder."
