            waarde: "Meepraten levert **XP** op. Vanaf **level 3** doe je mee aan giveaways, vanaf **level 5** post je in de markt.\nBekijk je level met `/level`.\n​"
          - naam: "🎙️  Liever praten?"
            waarde: "Kom erbij in het spraakkanaal **Lounge**. Gewoon binnenlopen, iedereen is welkom."
