kanaal: release-kalender
berichten:
  - sleutel: kaart
    embeds:
      - banner: releases
        soort: release
      - soort: release
        titel: "📅  Releasekalender Nederland & België"
        beschrijving: |
          Hier verschijnt **elke nieuwe release** met de **datum**, de **tijd**, de **winkels** en de **limiet per persoon**.

          Kies **Releases** in {#rollen} om een melding te krijgen.
        velden:
          - naam: "🎉  Op de releasedag"
            waarde: "Onder elke release opent een **releasedraad** met tips: welke winkels vroeg uitpakken en hoe lang de rij is.\nOm **20:00** is de **releaseavond** op de stage: samen uitpakken en pulls delen.\n​"
          - naam: "🗓️  Overzicht"
            waarde: "Onderaan dit kanaal staat altijd een **overzicht van de komende releases**, automatisch bijgewerkt.\n​"
          - naam: "❓  Mis je een release?"
            waarde: "Laat het weten via een ticket in {#tickets}."
        afbeelding: "{afbeelding:releasedag}"
