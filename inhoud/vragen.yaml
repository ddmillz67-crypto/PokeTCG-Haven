# Vraag van de week (woensdag). De bot neemt ze op volgorde en begint daarna opnieuw.
vragen:
  - nl: "Welke kaart zoek je al jaren?"
    en: "Which card have you been chasing for years?"
  - nl: "Wat was je allereerste Pokémon-kaart?"
    en: "What was your very first Pokémon card?"
  - nl: "Welke set uit de laatste twee jaar vind je het mooist, en waarom?"
    en: "Which set from the last two years is your favourite, and why?"
  - nl: "Sealed bewaren of openen: wat doe jij?"
    en: "Keep it sealed or open it: what do you do?"
  - nl: "Welke Pokémon verzamel je het liefst?"
    en: "Which Pokémon do you love collecting most?"
  - nl: "Wat is je beste ruil ooit geweest?"
    en: "What's the best trade you've ever made?"
  - nl: "Welke illustrator vind je het mooist?"
    en: "Who is your favourite card illustrator?"
  - nl: "Japanse of Engelse kaarten: wat heeft je voorkeur?"
    en: "Japanese or English cards: which do you prefer?"
  - nl: "Wat is je tip voor iemand die net begint met verzamelen?"
    en: "What's your tip for someone who just started collecting?"
  - nl: "Welke kaart zou je nooit verkopen, voor geen enkel bedrag?"
    en: "Which card would you never sell, for any price?"
  - nl: "Hoe bewaar je je collectie: binders, toploaders of iets anders?"
    en: "How do you store your collection: binders, toploaders or something else?"
  - nl: "Op welke aankomende release verheug je je het meest?"
    en: "Which upcoming release are you most excited about?"
