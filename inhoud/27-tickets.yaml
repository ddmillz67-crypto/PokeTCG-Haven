kanaal: tickets
berichten:
  - sleutel: paneel
    embeds:
      - soort: merk
        titel: "🛟 Open een ticket / Open a ticket"
        beschrijving: |
          Kies hieronder waar je hulp bij nodig hebt. Er opent een privégesprek met jou en het team; niemand anders ziet het.

          🇬🇧 Pick what you need help with. A private conversation opens with you and the team.
    knoppen:
      - { label: "Hulp / Help", emoji: "❓", actie: "ticket:hulp", stijl: primair }
      - { label: "Store en betaling", emoji: "🛒", actie: "ticket:store" }
      - { label: "Iets melden / Report", emoji: "🚩", actie: "ticket:melding", stijl: rood }
      - { label: "Giveaway gewonnen / Won", emoji: "🎁", actie: "ticket:giveaway", stijl: groen }
      - { label: "Partner worden", emoji: "🏪", actie: "ticket:partner" }
