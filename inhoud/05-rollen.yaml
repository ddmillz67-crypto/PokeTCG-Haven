kanaal: rollen
berichten:
  - sleutel: uitleg
    embeds:
      - banner: rollen
        soort: community
      - soort: community
        titel: "🎛️  Kies je rollen"
        beschrijving: |
          Met de menu's hieronder kies je **wat je verzamelt**, **waar je woont** en **welke meldingen** je wilt.

          Je kunt het altijd aanpassen. Haal een vinkje weg en de rol verdwijnt.

  - sleutel: interesses
    embeds:
      - soort: community
        titel: "🃏  Wat verzamel je?"
        beschrijving: "Zo zien anderen meteen waar je mee bezig bent."
    menu:
      actie: "rollen:interesses"
      plaatshouder: "Kies wat je verzamelt"
      opties:
        - { label: "Sealed (boxen, ETB's)", rol: "Sealed", emoji: "📦" }
        - { label: "Singles (losse kaarten)", rol: "Singles", emoji: "🃏" }
        - { label: "Japanse kaarten", rol: "Japans", emoji: "🇯🇵" }
        - { label: "TCG Pocket", rol: "TCG Pocket", emoji: "📱" }
        - { label: "Ik begin net", rol: "Beginner", emoji: "🌱", beschrijving: "Haven Helpers helpen je extra" }

  - sleutel: regio
    embeds:
      - soort: community
        titel: "📍  Waar woon je?"
        beschrijving: "Voor meldingen uit de **winkel-radar** bij jou in de buurt."
    menu:
      actie: "rollen:regio"
      plaatshouder: "Kies je regio"
      max: 1
      opties:
        - { label: "Noord-Nederland", rol: "Noord-NL" }
        - { label: "Midden-Nederland", rol: "Midden-NL" }
        - { label: "Zuid-Nederland", rol: "Zuid-NL" }
        - { label: "Vlaanderen", rol: "Vlaanderen" }
        - { label: "Brussel", rol: "Brussel" }
        - { label: "Wallonië", rol: "Wallonië" }
        - { label: "Buiten Nederland en België", rol: "Buiten NL/BE" }

  - sleutel: pings
    embeds:
      - soort: community
        titel: "🔔  Welke meldingen wil je?"
        beschrijving: "Je krijgt **alleen** wat je hier kiest."
    menu:
      actie: "rollen:pings"
      plaatshouder: "Kies je meldingen"
      opties:
        - { label: "Releases", rol: "Release-ping", emoji: "📅" }
        - { label: "Restocks (gratis, 10 minuten vertraagd)", rol: "Restock-ping", emoji: "📦" }
        - { label: "Events en pack-avonden", rol: "Event-ping", emoji: "🎉" }
        - { label: "Giveaways", rol: "Giveaway-ping", emoji: "🎁" }
